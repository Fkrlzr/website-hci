<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gallery - PicVerse</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/gallery.css" />
  </head>
  <body>
    <nav class="navbar">
      <div class="nav-brand">
        <a href="../index.html">PicVerse</a>
      </div>
      <div class="nav-menu">
        <a href="../index.html">Home</a>
        <a href="gallery.html" class="active">Gallery</a>
        <a href="submission.html">Submission</a>
        <a href="community.html">Community</a>
        <a href="about.html">About Us</a>
      </div>
      <button
        class="nav-toggle"
        type="button"
        aria-label="Open menu"
        aria-expanded="false"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>
    </nav>

    <main>
      <section class="gallery-header">
        <h1>Gallery</h1>
        <p>Explore and discover art from artists all over the world</p>
      </section>

      <section class="gallery-tags">
        <div class="tags-scroll">
          <button class="tag active" type="button">Digital Art</button>
          <button class="tag" type="button">Illustration</button>
          <button class="tag" type="button">Pixel Art</button>
          <button class="tag" type="button">Fan Art</button>
          <button class="tag" type="button">Abstract</button>
          <button class="tag" type="button">Character Design</button>
          <button class="tag" type="button">Anime</button>
          <button class="tag" type="button">Concept Art</button>
          <button class="tag" type="button">Gaming</button>
          <button class="tag" type="button">3D Art</button>
        </div>
      </section>

      <section class="gallery-grid">
        <!-- Gallery items will be populated by JavaScript -->
      </section>

      <div class="pagination">
        <button class="prev-page" type="button">Previous</button>
        <div class="page-numbers">
          <button class="active" type="button" aria-label="Page 1">1</button>
          <button type="button" aria-label="Page 2">2</button>
          <button type="button" aria-label="Page 3">3</button>
          <button type="button" aria-label="Page 4">4</button>
          <button type="button" aria-label="Page 5">5</button>
        </div>
        <button class="next-page" type="button">Next</button>
      </div>
    </main>

    <!-- Modal for artwork details -->
    <div
      class="artwork-modal"
      id="artworkModal"
      role="dialog"
      aria-modal="true"
      aria-label="Artwork details"
    >
      <div class="modal-content">
        <button class="modal-close" type="button" aria-label="Close">
          &times;
        </button>
        <div class="modal-body">
          <div class="artwork-image">
            <img src="" alt="Artwork" />
          </div>
          <div class="artwork-details">
            <h2 class="artwork-title"></h2>
            <p class="artwork-artist"></p>
            <div class="artwork-stats">
              <span class="likes"></span>
              <span class="views"></span>
            </div>
            <div class="artwork-description"></div>
            <div class="artwork-tags"></div>
          </div>
        </div>
      </div>
    </div>

    <footer>
      <div class="footer-content">
        <div class="footer-brand">
          <h3>PicVerse</h3>
          <p>A new world of art creation and appreciation</p>
        </div>
        <div class="footer-links">
          <div class="link-group">
            <h4>Navigation</h4>
            <a href="../index.html">Home</a>
            <a href="gallery.html">Gallery</a>
            <a href="submission.html">Submission</a>
            <a href="community.html">Community</a>
            <a href="about.html">About Us</a>
          </div>
        </div>
      </div>
      <div class="footer-bottom">
        <p>&copy; 2024 PicVerse. All rights reserved.</p>
      </div>
    </footer>

    <script src="../js/main.js"></script>
    <script src="../js/gallery.js"></script>
  </body>
</html>
